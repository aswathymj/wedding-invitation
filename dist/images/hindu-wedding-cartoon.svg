<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Pastel Hindu wedding cartoon</title>
  <desc id="desc">A bride and groom in traditional attire beneath a flower-decorated mandap, with garlands and a small sacred fire.</desc>
