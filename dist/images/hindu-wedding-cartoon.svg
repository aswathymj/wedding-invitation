    <linearGradient id="brideSari" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8e4eb"/><stop offset="1" stop-color="#d9aec5"/></linearGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d3b576"/><stop offset=".5" stop-color="#f3e2b5"/><stop offset="1" stop-color="#c4a064"/></linearGradient>
  </defs>
