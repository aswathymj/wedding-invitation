name: Deploy wedding invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - run: npm run build
      - name: Adjust asset paths for GitHub project site
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "/src/": "/wedding-invitation/src/",
              "/images/": "/wedding-invitation/images/",
              "/audio/": "/wedding-invitation/audio/",
              "/og/": "/wedding-invitation/og/",
              "/favicon.svg": "/wedding-invitation/favicon.svg",
          }

          for file in Path("dist").rglob("*"):
              if file.is_file() and file.suffix in {".html", ".js", ".css"}:
                  text = file.read_text(encoding="utf-8")
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  file.write_text(text, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
